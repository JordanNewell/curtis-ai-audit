name: Release

# Cutting a release: push a tag (v*). The workflow builds the release assets
# on CI, proves their provenance with artifact attestations, and attaches
# them to a GitHub release — so users can verify main.js/styles.css were
# built from this source tree. The committed main.js must match the CI build
# byte-for-byte (the Obsidian plugin checker enforces the same contract).

on:
  push:
    tags:
      # Plain "X.Y.Z" tags are the convention here — the Obsidian plugin
      # checker matches the manifest version against the release tag.
      # "vX.Y.Z" is also accepted.
      - "*"
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: 'Guard: committed main.js must match the build'
        run: git diff --exit-code --stat main.js

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
